<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tinnitus Sound Studio</title><style>body{font:16px system-ui;background:#f5f7fa;color:#182638;max-width:600px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:10px;margin:4px;border:1px solid #bcc5cf;border-radius:8px}button{background:#245679;color:white}input[type=range]{width:90%;padding:0}input[type=number]{width:100px}small{display:block}</style><h2>Tinnitus Sound Studio</h2><p>Start at minimum device volume. Stop if uncomfortable. Experimental sound tool, not a proven treatment.</p><section id="ears"></section><section>Signal level <input id="level" type="range" min="0" max="10" step=".5" value="1"><br>Duration <select id="dur"><option>2</option><option selected>3</option><option>5</option></select> seconds<br><button id="both">Play both relief tones</button><button id="stop">Stop all</button></section><section><h3>Notched music</h3><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.flac"><p id="name">Choose a local file</p><label>Notch width <select id="width"><option value=".5">Half octave</option><option value="1">Full octave</option></select></label><label><input id="filter" type="checkbox" checked> Filter enabled</label><br><button id="music">Play / pause music</button><audio id="audio" controls playsinline style="width:100%"></audio><small>Uses saved pitch values, not relief values. Files stay on your device.</small></section><section><h3>Progress</h3><label>Before (0–10) <input id="before" type="number" min="0" max="10"></label><label>After <input id="after" type="number" min="0" max="10"></label><button id="log">Record</button><pre id="history" style="white-space:pre-wrap"></pre></section><p id="status" role="status">Ready</p><script>
const $=id=>document.getElementById(id);let ac,active=[],graph,objectURL;const key='tinnitus-v1';let data={l:{pitch:6000,relief:6000},r:{pitch:6500,relief:6500},history:[]};try{const old=JSON.parse(localStorage.getItem(key));if(old)data=old}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{status('Storage unavailable')}}function status(s){$('status').textContent=s}function val(v){return Math.max(100,Math.min(16000,Math.round(Number(v)||100)))}for(const e of ['l','r']){let el=document.createElement('div');el.innerHTML='<h3>'+ (e==='l'?'Left':'Right')+' ear</h3>'+['pitch','relief'].map(k=>'<label>'+k+' Hz <input type="number" min="100" max="16000" id="'+e+k+'" value="'+data[e][k]+'"></label><br><input type="range" min="0" max="1000" id="'+e+k+'range"><br>'+[-100,-10,-1,1,10,100].map(n=>'<button data-e="'+e+'" data-k="'+k+'" data-n="'+n+'">'+(n>0?'+':'')+n+'</button>').join('')+'<button data-play="'+e+'" data-kind="'+k+'">Play '+k+'</button><hr>').join('');$('ears').append(el)}
function set(e,k,v){data[e][k]=val(v);$(e+k).value=data[e][k];$(e+k+'range').value=Math.log(data[e][k]/100)/Math.log(160)*1000;save();update()}for(const e of ['l','r'])for(const k of ['pitch','relief']){$(e+k).onchange=()=>set(e,k,$(e+k).value);$(e+k+'range').oninput=()=>set(e,k,100*Math.pow(160,$(e+k+'range').value/1000));set(e,k,data[e][k])}
async function init(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();return ac}function silence(){for(const o of active)try{o.stop()}catch{}active=[]}async function tone(es,k){try{$('audio').pause();silence();await init();let t=ac.currentTime,d=Number($('dur').value),m=ac.createChannelMerger(2);m.connect(ac.destination);for(const e of es){let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=data[e][k];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(Number($('level').value)/100,t+.08);g.gain.setValueAtTime(Number($('level').value)/100,t+d-.08);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(m,0,e==='l'?0:1);o.start();o.stop(t+d);active.push(o);o.onended=()=>{o.disconnect();g.disconnect()}}setTimeout(()=>m.disconnect(),(d+.2)*1000);status('Tone playing for '+d+' seconds')}catch(e){status(e.message)}}document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>set(b.dataset.e,b.dataset.k,data[b.dataset.e][b.dataset.k]+Number(b.dataset.n)));document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>tone([b.dataset.play],b.dataset.kind));$('both').onclick=()=>tone(['l','r'],'relief');$('stop').onclick=()=>{silence();$('audio').pause();status('Stopped')};
function update(){if(!graph)return;let w=Number($('width').value),q=1/(Math.pow(2,w/2)-Math.pow(2,-w/2));for(let i=0;i<2;i++){let f=graph.filters[i];f.frequency.value=data[i?'r':'l'].pitch;f.Q.value=q;graph.wet[i].gain.value=$('filter').checked?1:0;graph.dry[i].gain.value=$('filter').checked?0:1}}
async function setup(){await init();if(graph)return;let src=ac.createMediaElementSource($('audio')),split=ac.createChannelSplitter(2),merge=ac.createChannelMerger(2);graph={filters:[],wet:[],dry:[]};src.connect(split);for(let i=0;i<2;i++){let f=ac.createBiquadFilter(),wet=ac.createGain(),dry=ac.createGain();f.type='notch';split.connect(f,i);f.connect(wet);wet.connect(merge,0,i);split.connect(dry,i);dry.connect(merge,0,i);graph.filters.push(f);graph.wet.push(wet);graph.dry.push(dry)}let gain=ac.createGain();gain.gain.value=.5;merge.connect(gain);gain.connect(ac.destination);update()}
$('width').onchange=update;$('filter').onchange=update;$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;$('audio').pause();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);$('audio').src=objectURL;$('name').textContent=f.name};$('music').onclick=async()=>{try{silence();await setup();if(!$('audio').src)return status('Choose a file first');if($('audio').paused)await $('audio').play();else $('audio').pause()}catch(e){status(e.message)}};$('audio').onplay=()=>{silence();setup().catch(e=>status(e.message))};function history(){ $('history').textContent=data.history.map(x=>x.join(' | ')).join('\n')}$('log').onclick=()=>{let a=$('before').value,b=$('after').value;if(a===''||b===''||[a,b].some(x=>Number(x)<0||Number(x)>10))return;data.history.push([new Date().toLocaleString(),a,b]);save();history()};history();</script></html>
